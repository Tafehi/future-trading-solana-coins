# Terraform plan on pull requests that touch infra or the host files. Read-only role (gha-aws-foundation-plan),
# `-lock=false` because the plan role may not write the lock object. The plan goes to the job summary.

name: Terraform plan

on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/**'
      - 'statusCheck.sh'
      - 'hostSetup.sh'
      - 'docker-compose.yml'
      - 'app/Dockerfile'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-central-1
  PLAN_ROLE: arn:aws:iam::267850879774:role/gha-aws-foundation-plan
  STATE_BUCKET: terraform-state-267850879774
  STATE_KEY: future-trading-solana-coins/terraform.tfstate
  TF_VAR_aws_region: eu-central-1

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3
        with:
          terraform_version: '1.10'
          terraform_wrapper: false
      - name: Configure AWS credentials (OIDC, plan role)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4
        with:
          role-to-assume: ${{ env.PLAN_ROLE }}
          role-session-name: gha-solana-future-coin-plan-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      - name: fmt, init, validate
        run: |
          terraform -chdir=infra fmt -check -recursive
          terraform -chdir=infra init -input=false \
            -backend-config="bucket=$STATE_BUCKET" -backend-config="key=$STATE_KEY" -backend-config="region=$AWS_REGION"
          terraform -chdir=infra validate
      - name: Dockerfile builds (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: app/Dockerfile
          push: false
      - name: plan
        id: plan
        continue-on-error: true
        run: |
          set -o pipefail
          terraform -chdir=infra plan -input=false -lock=false -no-color 2>&1 | tee plan.txt
      - name: Summary
        run: |
          { echo "## Terraform plan"; echo '```'; head -c 500000 plan.txt; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
      - name: Fail if the plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

# The solana-future-coin bot on the EC2 box. One container. `ECR_REGISTRY` comes from the systemd unit (solana-future-coin.service).
#
# - Health binds 127.0.0.1 only: nothing on the box listens on a public interface (statusCheck.sh section 0).
# - .env holds the solana-future-bot secret, rendered hourly by solana-future-coin-env.timer; never baked into the image.
# - data/ holds the SQLite database, the Parquet spool and the STOP kill-switch file.
services:
  bot:
    image: ${ECR_REGISTRY}/solana-future-coin:latest
    container_name: solana-future-coin
    restart: unless-stopped
    env_file: /opt/solana-future-coin/.env
    environment:
      AWS_REGION: eu-central-1
      LOG_DIR: /app/logs
    volumes:
      - /opt/solana-future-coin/data:/app/data
      - /opt/solana-future-coin/logs/app:/app/logs
    ports:
      - "127.0.0.1:8080:8080"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # t4g.micro has 1 GB; the bot uses ~150-300 MB (pyarrow; no Hyperliquid leaderboard since the split).
    mem_limit: 700m
    memswap_limit: 700m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
